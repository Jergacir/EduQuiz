<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unirme a Partida - EduQuiz</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crearQuizz.css') }}"> 
    <link rel="stylesheet" href="{{ url_for('static', filename='css/partidas.css') }}"> </head>

<body data-usuario-id="{{ logged_in_user.usuario_id }}">

    <aside class="sidebar">
        <div class="logo">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="EduQuiz Logo">
            EduQuiz
        </div>
        <nav class="nav-menu">
            <a href="{{ url_for('pages.frm_home') }}" class="nav-item">
                <i class="icon-inicio"></i> Inicio
            </a>
            <a href="{{ url_for('cuestionarios.frm_cuestionarios') }}" class="nav-item">
                <i class="icon-cuestionarios"></i> Cuestionarios
            </a>
            <a href="{{ url_for('tienda.tienda_index') }}" class="nav-item">
                <i class="icon-tienda"></i> Tienda
            </a>
            <a href="{{ url_for('partidas.frm_partidas') }}" class="nav-item active">
                <i class="icon-partida"></i> Unirme a una partida
            </a>
            
            <hr>
            <a href="{{ url_for('usuarios.usuarios_index') }}" class="nav-item">
                <i class="icon-configuracion"></i> Configuración
            </a>
            <a href="{{ url_for('auth.logout') }}" class="nav-item">
                <i class="icon-cerrar-sesion"></i> Cerrar Sesión
            </a>
            </nav>
    </aside>

    <div class="main-container">

        <header class="top-header">
            <div class="search-bar-partida">
                <h2>Unirme a una Partida</h2>
            </div>
            <div class="user-profile-widget">
                <span class="coins">{{ logged_in_user.cant_monedas }} 💰</span>
                <a href="{{ url_for('usuarios.usuarios_index') }}" class="profile-link">
                    <img src="{{ url_for('static', filename='img/avatar.png') }}" alt="Avatar" class="avatar">
                    <span class="username">Mi Perfil</span>
                </a>
            </div>
        </header>

        <main class="content-area partida-area">
            
            <div class="join-card">
                <h1>Ingresa el Código de Partida</h1>
                <p>Tu profesor te proporcionará un código de 6 dígitos.</p>

                <input type="text" id="gameCodeInput" maxlength="6" placeholder="EJ: 123456">
                
                <button id="joinButton" class="btn-primary full-width-btn">
                    <i class="icon-play"></i> Unirme
                </button>

                <p id="messageArea" class="message-text"></p>
            </div>

        </main>
    </div>

    <script src="{{ url_for('static', filename='js/unirse_partida.js') }}"></script>
</body>

</html>
