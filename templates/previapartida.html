<!-- templates/previapartida.html -->
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previa de Partida - EduQuiz</title>

    <link rel="icon" href="/static/img/icono.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../static/css/previapartida.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body data-logged-user='{{ logged_in_user | tojson | default("null") }}'
     data-is-group-game='{{ "true" if tipo_partida == "G" else "false" }}' 
     data-num-grupos='{{ num_grupos }}'>
    
    <div class="container">
        <div class="header-card">
            <p>Únete en esta emocionante partida con este código</p>
            <div class="code-section">
                <span class="game-code">{{ codigo_partida }}</span>
                <i class="far fa-copy copy-icon"></i>
            </div>
            <img src="qr-code.png" alt="Código QR" class="qr-code" style="display:none;">
            <button class="start-game-button">Iniciar Partida</button>
        </div>

        <!-- ✅ NUEVO: Sección con contador de participantes -->
        <div class="waiting-header">
            <h2 class="waiting-message">Esperando participantes</h2>
            <div class="participants-counter">
                <i class="fas fa-users"></i>
                <span id="participantCount">0</span>
            </div>
        </div>

        <!-- Vista Individual -->
        <div id="individual-view" class="participants-container individual-layout">
            <!-- Se llenará dinámicamente con AJAX Polling -->
        </div>

        <!-- Vista Grupal -->
        <div id="group-view" class="participants-container group-layout" style="display: none;">
            <!-- Se llenará dinámicamente con AJAX Polling -->
        </div>
    </div>

    <!-- AJAX Polling (Sin Socket.IO) -->
    <script src="../static/js/previapartida.js"></script>
</body>

</html>
