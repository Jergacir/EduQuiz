<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitar restablecer contraseña - EduQuiz</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/registro.css') }}">
</head>
<body>
  <div class="contenedor">
    <div class="panel-izquierdo">
      <div class="formulario-contenedor">
        <h1>Recuperar contraseña</h1>
  <form method="post" action="{{ url_for('modificarcontrasena.solicitar_restablecer') }}">
          <div class="grupo-formulario">
            <label for="email">Correo electrónico</label>
            <input id="email" name="email" type="email" required placeholder="tu@dominio.com">
          </div>
          <button class="btn-primario" type="submit">Enviar instrucciones</button>
        </form>
        <div class="enlace-sesion">
          <a href="{{ url_for('auth.frm_login') }}">Volver al inicio de sesión</a>
        </div>
      </div>
    </div>
    <div class="panel-derecho">
      <div class="panel-derecho-contenido">
        <h2>Recupera el acceso</h2>
        <p>Te enviaremos un enlace seguro para restablecer tu contraseña si el correo existe en nuestro sistema.</p>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/ui_modal.js') }}"></script>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash-msg" data-cat="{{ cat }}" data-msg="{{ msg|e }}" style="display:none"></div>
  {% endfor %}
  <div id="login-url" data-url="{{ url_for('auth.frm_login') }}" style="display:none"></div>
  <script>
    (function(){
      try {
        var nodes = document.querySelectorAll('.flash-msg');
        for (var i=0;i<nodes.length;i++){
          var n = nodes[i];
          var cat = n.getAttribute('data-cat');
          var msg = n.getAttribute('data-msg');
          if (cat === 'reset_info'){
            var loginEl = document.getElementById('login-url');
            var loginUrl = loginEl ? loginEl.getAttribute('data-url') : '/login';
            if (typeof showModal === 'function') showModal('Enviado', msg, { onClose: function(){ window.location.href = loginUrl; } });
            else { alert(msg); window.location.href = loginUrl; }
            break;
          }
          if (cat === 'reset_warning'){
            if (typeof showModal === 'function') showModal('Advertencia', msg);
            else alert(msg);
            break;
          }
        }
      } catch(e){ console.error(e); }
    })();
  </script>
</body>
</html>
