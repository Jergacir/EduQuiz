<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparando Partida - EduQuiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Partículas de fondo */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-20px) translateX(20px); }
        }

        /* Container principal */
        .countdown-container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        /* Número de cuenta regresiva */
        .countdown-number {
            font-size: 220px;
            font-weight: 900;
            color: white;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: pulse 1s ease-in-out;
            line-height: 1;
            margin: 0;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Texto "Let's Go" */
        .lets-go {
            font-size: 120px;
            font-weight: 900;
            color: white;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            animation: letsGoAnimation 1.5s ease-out;
            line-height: 1;
            margin: 0;
        }

        @keyframes letsGoAnimation {
            0% {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.3) rotate(5deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Mensaje de preparación */
        .preparation-message {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 30px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Anillo circular animado */
        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            border: 8px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: ringPulse 1s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes ringPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.5;
            }
        }

        /* Loader de redirección */
        .redirect-loader {
            margin-top: 40px;
            display: none;
        }

        .redirect-loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .redirect-text {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .countdown-number {
                font-size: 150px;
            }
            .lets-go {
                font-size: 80px;
            }
            .preparation-message {
                font-size: 18px;
                padding: 0 20px;
            }
            .ring {
                width: 300px;
                height: 300px;
            }
        }

        @media (max-width: 480px) {
            .countdown-number {
                font-size: 100px;
            }
            .lets-go {
                font-size: 60px;
            }
            .preparation-message {
                font-size: 16px;
            }
            .ring {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>
<body data-codigo-partida="{{ codigo_partida }}" data-tipo-usuario="{{ logged_in_user.tipo_usuario }}">
    
    <!-- Partículas de fondo -->
    <div class="particles" id="particles"></div>

    <!-- Anillo animado -->
    <div class="ring"></div>

    <!-- Container principal -->
    <div class="countdown-container">
        <div id="countdownDisplay">
            <!-- Aquí se mostrará el número o "Let's Go" -->
        </div>
        <p class="preparation-message" id="message">Prepárate...</p>
        
        <!-- Loader de redirección -->
        <div class="redirect-loader" id="redirectLoader">
            <div class="spinner"></div>
            <p class="redirect-text">Cargando partida...</p>
        </div>
    </div>

    <script src="/static/js/cuentaregresiva.js"></script>
    <script src="/static/js/esperando.js"></script>
</body>
</html>
